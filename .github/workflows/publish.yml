name: Build and Publish

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - .gitignore
      - LICENSE
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - run: nuget restore "OPL WpfApp.sln"
      - run: msbuild /p:Configuration=Release /p:Platform="Any CPU" "OPL WpfApp.sln"
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            WpfApp1\bin\Release\OPL_WpfApp.exe
            updata\bin\Release\updata.exe
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if publish is needed
        id: check
        shell: pwsh
        run: |
          $netCs = Get-Content "WpfApp1\cs\net.cs" -Raw
          $pvn = [int][regex]::Match($netCs, 'pvn\s*=\s*(\d+)').Groups[1].Value
          $assemblyInfo = Get-Content "WpfApp1\Properties\AssemblyInfo.cs" -Raw
          $version = [regex]::Match($assemblyInfo, 'AssemblyFileVersion\("([^"]+)"\)').Groups[1].Value

          try {
            $remotePvn = [int](Invoke-RestMethod "https://raw.githubusercontent.com/Guailoudou/urlfile/main/file/json/update.json").version
          } catch {
            try {
              # Only used for the first migration, before update.json exists.
              $remotePvn = [int](Invoke-RestMethod "https://raw.githubusercontent.com/Guailoudou/urlfile/main/file/json/preset.json").version
            } catch {
              $remotePvn = -1
            }
          }

          "pvn=$pvn" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "zipname=$version-$pvn.zip" >> $env:GITHUB_OUTPUT
          "should_publish=$($pvn -gt $remotePvn)".ToLower() >> $env:GITHUB_OUTPUT
          Write-Host "Local update: $pvn; remote update: $remotePvn"

      - name: Download build artifacts
        if: steps.check.outputs.should_publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build-output

      - name: Clone publishing repositories
        if: steps.check.outputs.should_publish == 'true'
        shell: pwsh
        run: |
          git clone https://github.com/Guailoudou/urlfile.git urlfile-repo
          git clone https://github.com/Guailoudou/openp2p.git openp2p-repo
          git -C urlfile-repo config user.name "github-actions[bot]"
          git -C urlfile-repo config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check OpenP2P version
        if: steps.check.outputs.should_publish == 'true'
        id: core
        shell: pwsh
        run: |
          $protocol = Get-Content "openp2p-repo\core\protocol.go" -Raw
          $coreVersion = [regex]::Match($protocol, 'OpenP2PVersion\s*=\s*"([^"]+)"').Groups[1].Value
          if (!$coreVersion) { throw "OpenP2PVersion not found" }

          $updatePath = "urlfile-repo\file\json\update.json"
          $migration = !(Test-Path $updatePath)
          if ($migration) {
            $preset = Get-Content "urlfile-repo\file\json\preset.json" -Raw | ConvertFrom-Json
            $publishedVersion = [regex]::Match($preset.opurl, 'openp2p-(?:r)?([0-9.]+)\.windows-386\.zip').Groups[1].Value
          } else {
            $publishedVersion = (Get-Content $updatePath -Raw | ConvertFrom-Json).opversion
          }

          "version=$coreVersion" >> $env:GITHUB_OUTPUT
          "should_build=$($coreVersion -ne $publishedVersion)".ToLower() >> $env:GITHUB_OUTPUT
          "migration=$migration".ToLower() >> $env:GITHUB_OUTPUT
          Write-Host "OpenP2P source: $coreVersion; published: $publishedVersion"

      - name: Setup Go
        if: steps.check.outputs.should_publish == 'true' && steps.core.outputs.should_build == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: openp2p-repo/go.mod
          cache-dependency-path: openp2p-repo/go.sum

      - name: Build OpenP2P core
        if: steps.check.outputs.should_publish == 'true' && steps.core.outputs.should_build == 'true'
        shell: pwsh
        working-directory: openp2p-repo
        env:
          GOOS: windows
          GOARCH: "386"
          CGO_ENABLED: "0"
          GOPROXY: https://goproxy.io,direct
        run: go build -trimpath -ldflags="-s -w" -o ..\openp2p.exe cmd/openp2p.go

      - name: Package and hash files
        if: steps.check.outputs.should_publish == 'true'
        id: package
        shell: pwsh
        run: |
          $appZip = "${{ steps.check.outputs.zipname }}"
          Compress-Archive "build-output\WpfApp1\bin\Release\OPL_WpfApp.exe" $appZip -Force
          "app_md5=$((Get-FileHash $appZip -Algorithm MD5).Hash.ToLower())" >> $env:GITHUB_OUTPUT

          if ("${{ steps.core.outputs.should_build }}" -eq "true") {
            $coreZip = "openp2p-${{ steps.core.outputs.version }}.windows-386.zip"
            Compress-Archive openp2p.exe $coreZip -Force
            "core_zip=$coreZip" >> $env:GITHUB_OUTPUT
            "core_md5=$((Get-FileHash openp2p.exe -Algorithm MD5).Hash.ToLower())" >> $env:GITHUB_OUTPUT
          }

      - name: Update publishing files
        if: steps.check.outputs.should_publish == 'true'
        shell: pwsh
        run: |
          $pvn = [int]"${{ steps.check.outputs.pvn }}"
          $appZip = "${{ steps.check.outputs.zipname }}"
          $appUrl = "https://file.gldhn.top/file/uppack/$appZip"
          $updatePath = "urlfile-repo\file\json\update.json"
          $presetPath = "urlfile-repo\file\json\preset.json"

          Copy-Item $appZip "urlfile-repo\file\uppack\$appZip"

          if (Test-Path $updatePath) {
            $update = Get-Content $updatePath -Raw | ConvertFrom-Json
          } else {
            $preset = Get-Content $presetPath -Raw | ConvertFrom-Json
            $oldCoreVersion = [regex]::Match($preset.opurl, 'openp2p-(?:r)?([0-9.]+)\.windows-386\.zip').Groups[1].Value
            $update = [pscustomobject]@{
              version = 0; upurl = ""; uphash = ""
              opversion = $oldCoreVersion; opurl = $preset.opurl; ophash = $preset.ophash
            }
          }

          $update.version = $pvn
          $update.upurl = $appUrl
          $update.uphash = "${{ steps.package.outputs.app_md5 }}"

          if ("${{ steps.core.outputs.should_build }}" -eq "true") {
            $coreZip = "${{ steps.package.outputs.core_zip }}"
            Copy-Item $coreZip "urlfile-repo\file\$coreZip"
            $update.opversion = "${{ steps.core.outputs.version }}"
            $update.opurl = "https://file.gldhn.top/file/$coreZip"
            $update.ophash = "${{ steps.package.outputs.core_md5 }}"
          }

          $update | ConvertTo-Json -Compress | Set-Content $updatePath -NoNewline

          if ("${{ steps.core.outputs.migration }}" -eq "true") {
            # Last legacy sync: old clients receive the release that reads update.json.
            $preset = Get-Content $presetPath -Raw | ConvertFrom-Json
            $preset.version = $update.version
            $preset.upurl = $update.upurl
            $preset.uphash = $update.uphash
            $preset.opurl = $update.opurl
            $preset.ophash = $update.ophash
            $preset | ConvertTo-Json -Depth 100 -Compress | Set-Content $presetPath -NoNewline
          }

      - name: Commit and push
        if: steps.check.outputs.should_publish == 'true'
        shell: pwsh
        env:
          URLFILE_TOKEN: ${{ secrets.URLFILE_TOKEN }}
        run: |
          git -C urlfile-repo add .
          git -C urlfile-repo commit -m "更新版本 ${{ steps.check.outputs.version }}-${{ steps.check.outputs.pvn }}"
          git -C urlfile-repo remote set-url origin "https://x-access-token:$env:URLFILE_TOKEN@github.com/Guailoudou/urlfile.git"
          git -C urlfile-repo push origin main
