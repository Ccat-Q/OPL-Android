name: Build and Publish

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - .gitignore
      - LICENSE
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - run: nuget restore "OPL WpfApp.sln"
      - run: msbuild /p:Configuration=Release /p:Platform="Any CPU" "OPL WpfApp.sln"
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            WpfApp1\bin\Release\OPL_WpfApp.exe
            updata\bin\Release\updata.exe
          retention-days: 7

  check:
    if: github.event_name == 'push'
    runs-on: windows-latest
    outputs:
      app_update: ${{ steps.updates.outputs.app_update }}
      app_pvn: ${{ steps.updates.outputs.app_pvn }}
      app_zip: ${{ steps.updates.outputs.app_zip }}
      core_update: ${{ steps.updates.outputs.core_update }}
      core_version: ${{ steps.updates.outputs.core_version }}
      migration: ${{ steps.updates.outputs.migration }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone update sources
        shell: pwsh
        run: |
          git clone https://github.com/Guailoudou/urlfile.git urlfile-repo
          git clone https://github.com/Guailoudou/openp2p.git openp2p-repo

      - name: Check updates
        id: updates
        shell: pwsh
        run: |
          $netCs = Get-Content "WpfApp1\cs\net.cs" -Raw
          $pvn = [int][regex]::Match($netCs, 'pvn\s*=\s*(\d+)').Groups[1].Value
          $assemblyInfo = Get-Content "WpfApp1\Properties\AssemblyInfo.cs" -Raw
          $version = [regex]::Match($assemblyInfo, 'AssemblyFileVersion\("([^"]+)"\)').Groups[1].Value

          $protocol = Get-Content "openp2p-repo\core\protocol.go" -Raw
          $coreVersion = [regex]::Match($protocol, 'OpenP2PVersion\s*=\s*"([^"]+)"').Groups[1].Value
          if (!$coreVersion) { throw "OpenP2PVersion not found" }

          $updatePath = "urlfile-repo\file\json\update.json"
          $migration = !(Test-Path $updatePath)
          if ($migration) {
            $published = Get-Content "urlfile-repo\file\json\preset.json" -Raw | ConvertFrom-Json
            $publishedPvn = [int]$published.version
            $publishedCoreVersion = [regex]::Match($published.opurl, 'openp2p-(?:r)?([0-9.]+)\.windows-386\.zip').Groups[1].Value
          } else {
            $published = Get-Content $updatePath -Raw | ConvertFrom-Json
            $publishedPvn = [int]$published.version
            $publishedCoreVersion = $published.opversion
          }

          "app_update=$($pvn -gt $publishedPvn)".ToLower() >> $env:GITHUB_OUTPUT
          "app_pvn=$pvn" >> $env:GITHUB_OUTPUT
          "app_zip=$version-$pvn.zip" >> $env:GITHUB_OUTPUT
          "core_update=$($coreVersion -ne $publishedCoreVersion)".ToLower() >> $env:GITHUB_OUTPUT
          "core_version=$coreVersion" >> $env:GITHUB_OUTPUT
          "migration=$migration".ToLower() >> $env:GITHUB_OUTPUT
          Write-Host "Main project: $pvn; published: $publishedPvn"
          Write-Host "OpenP2P: $coreVersion; published: $publishedCoreVersion"

  publish:
    needs: check
    if: needs.check.outputs.app_update == 'true' || needs.check.outputs.core_update == 'true'
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Clone publishing repositories
        shell: pwsh
        run: |
          git clone https://github.com/Guailoudou/urlfile.git urlfile-repo
          git clone https://github.com/Guailoudou/openp2p.git openp2p-repo
          git -C urlfile-repo config user.name "github-actions[bot]"
          git -C urlfile-repo config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup MSBuild
        if: needs.check.outputs.app_update == 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        if: needs.check.outputs.app_update == 'true'
        uses: nuget/setup-nuget@v2

      - name: Build main project
        if: needs.check.outputs.app_update == 'true'
        shell: pwsh
        run: |
          nuget restore "OPL WpfApp.sln"
          msbuild /p:Configuration=Release /p:Platform="Any CPU" "OPL WpfApp.sln"

      - name: Package main project
        if: needs.check.outputs.app_update == 'true'
        id: app_package
        shell: pwsh
        run: |
          $appZip = "${{ needs.check.outputs.app_zip }}"
          Compress-Archive "WpfApp1\bin\Release\OPL_WpfApp.exe" $appZip -Force
          "md5=$((Get-FileHash $appZip -Algorithm MD5).Hash.ToLower())" >> $env:GITHUB_OUTPUT

      - name: Setup Go
        if: needs.check.outputs.core_update == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.20'
          cache-dependency-path: openp2p-repo/go.sum

      - name: Build OpenP2P core
        if: needs.check.outputs.core_update == 'true'
        id: core_package
        shell: pwsh
        working-directory: openp2p-repo
        env:
          GOOS: windows
          GOARCH: "386"
          CGO_ENABLED: "0"
          GOPROXY: https://goproxy.io,direct
        run: |
          $goMod = (Get-Content go.mod -Raw) -replace '(?m)^go .+$', 'go 1.20'
          $goMod = $goMod -replace '(?m)^toolchain .+\r?\n?', ''
          Set-Content go1.20.mod $goMod -NoNewline
          Copy-Item go.sum go1.20.sum
          go build -modfile=go1.20.mod -trimpath -ldflags="-s -w" -o ..\openp2p.exe cmd/openp2p.go
          $coreZip = "openp2p-${{ needs.check.outputs.core_version }}.windows-386.zip"
          Compress-Archive ..\openp2p.exe ..\$coreZip -Force
          "zip=$coreZip" >> $env:GITHUB_OUTPUT
          "md5=$((Get-FileHash ..\openp2p.exe -Algorithm MD5).Hash.ToLower())" >> $env:GITHUB_OUTPUT

      - name: Initialize update metadata
        shell: pwsh
        run: |
          $updatePath = "urlfile-repo\file\json\update.json"
          $presetPath = "urlfile-repo\file\json\preset.json"
          if (!(Test-Path $updatePath)) {
            $preset = Get-Content $presetPath -Raw | ConvertFrom-Json
            $oldCoreVersion = [regex]::Match($preset.opurl, 'openp2p-(?:r)?([0-9.]+)\.windows-386\.zip').Groups[1].Value
            $update = [pscustomobject]@{
              version = 0; upurl = ""; uphash = ""
              opversion = $oldCoreVersion; opurl = $preset.opurl; ophash = $preset.ophash
            }
            $update | ConvertTo-Json -Compress | Set-Content $updatePath -NoNewline
          }

      - name: Update main project
        if: needs.check.outputs.app_update == 'true'
        shell: pwsh
        run: |
          $appZip = "${{ needs.check.outputs.app_zip }}"
          Copy-Item $appZip "urlfile-repo\file\uppack\$appZip"
          $updatePath = "urlfile-repo\file\json\update.json"
          $update = Get-Content $updatePath -Raw | ConvertFrom-Json
          $update.version = [int]"${{ needs.check.outputs.app_pvn }}"
          $update.upurl = "https://file.gldhn.top/file/uppack/$appZip"
          $update.uphash = "${{ steps.app_package.outputs.md5 }}"
          $update | ConvertTo-Json -Compress | Set-Content $updatePath -NoNewline

      - name: Update OpenP2P
        if: needs.check.outputs.core_update == 'true'
        shell: pwsh
        run: |
          $coreZip = "${{ steps.core_package.outputs.zip }}"
          Copy-Item $coreZip "urlfile-repo\file\$coreZip"
          $updatePath = "urlfile-repo\file\json\update.json"
          $update = Get-Content $updatePath -Raw | ConvertFrom-Json
          $update.opversion = "${{ needs.check.outputs.core_version }}"
          $update.opurl = "https://file.gldhn.top/file/$coreZip"
          $update.ophash = "${{ steps.core_package.outputs.md5 }}"
          $update | ConvertTo-Json -Compress | Set-Content $updatePath -NoNewline

      - name: Sync legacy metadata
        if: needs.check.outputs.migration == 'true'
        shell: pwsh
        run: |
          $update = Get-Content "urlfile-repo\file\json\update.json" -Raw | ConvertFrom-Json
          $presetPath = "urlfile-repo\file\json\preset.json"
          $preset = Get-Content $presetPath -Raw | ConvertFrom-Json
          $preset.version = $update.version
          $preset.upurl = $update.upurl
          $preset.uphash = $update.uphash
          $preset.opurl = $update.opurl
          $preset.ophash = $update.ophash
          $preset | ConvertTo-Json -Depth 100 -Compress | Set-Content $presetPath -NoNewline

      - name: Commit and push
        shell: pwsh
        env:
          URLFILE_TOKEN: ${{ secrets.URLFILE_TOKEN }}
        run: |
          git -C urlfile-repo add .
          git -C urlfile-repo commit -m "发布更新 app=${{ needs.check.outputs.app_update }} core=${{ needs.check.outputs.core_update }}"
          git -C urlfile-repo remote set-url origin "https://x-access-token:$env:URLFILE_TOKEN@github.com/Guailoudou/urlfile.git"
          git -C urlfile-repo push origin main
